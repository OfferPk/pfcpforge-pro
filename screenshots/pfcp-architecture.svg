<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b14" />
      <stop offset="100%" stop-color="#0c1426" />
    </linearGradient>
    <linearGradient id="smfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="upfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2e4f" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="url(#bgGrad)" />

  <text x="500" y="45" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="900" font-size="22" text-anchor="middle">5G Core CUPS Disaggregated Architecture (3GPP TS 29.244)</text>
  <text x="500" y="70" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">Control &amp; User Plane Separation via N4 PFCP (UDP 8805) &amp; PDR / FAR / QER / URR Dataplane Engine</text>

  <!-- Top: Control Plane (SMF) -->
  <rect x="250" y="110" width="500" height="110" rx="10" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="2" />
  <rect x="270" y="125" width="460" height="30" rx="6" fill="url(#smfGrad)" />
  <text x="500" y="146" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">5G Session Management Function (SMF) — Control Plane</text>
  <text x="500" y="180" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">IP: 10.200.1.10 | Allocates F-SEID, PDR IDs, FAR IDs, QER Flow Rules, URR Quotas</text>
  <text x="500" y="200" fill="#34d399" font-family="monospace" font-weight="bold" font-size="11" text-anchor="middle">Cryptographic 64-Bit F-SEID State Machine | PDR Precedence Disambiguation</text>

  <!-- Middle: N4 Interface with IPsec Encryption -->
  <line x1="500" y1="220" x2="500" y2="300" stroke="#10b981" stroke-width="4" stroke-dasharray="8,4" />
  <rect x="360" y="245" width="280" height="32" rx="6" fill="#091120" stroke="#10b981" stroke-width="1.5" />
  <text x="500" y="266" fill="#34d399" font-family="monospace" font-weight="bold" font-size="11" text-anchor="middle">N4 Interface (PFCP / UDP 8805 + IPsec)</text>

  <!-- Bottom: User Plane (UPF) -->
  <rect x="150" y="300" width="700" height="200" rx="10" fill="url(#nodeGrad)" stroke="#10b981" stroke-width="2" />
  <rect x="170" y="315" width="660" height="30" rx="6" fill="url(#upfGrad)" />
  <text x="500" y="336" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">5G User Plane Function (UPF) — High-Performance Dataplane</text>

  <!-- 4 Sub-Engines inside UPF -->
  <!-- 1. PDR -->
  <rect x="170" y="360" width="150" height="120" rx="6" fill="#091120" stroke="#38bdf8" />
  <text x="245" y="385" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">PDR (Match)</text>
  <text x="245" y="410" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">Source Interface</text>
  <text x="245" y="430" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">Local F-TEID</text>
  <text x="245" y="450" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">UE IP &amp; SDF 5-Tuple</text>
  <text x="245" y="470" fill="#fbbf24" font-family="monospace" font-size="10" text-anchor="middle">Prec: 10 - 255</text>

  <!-- 2. FAR -->
  <rect x="340" y="360" width="150" height="120" rx="6" fill="#091120" stroke="#10b981" />
  <text x="415" y="385" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">FAR (Action)</text>
  <text x="415" y="410" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">FORW (GTP-U Outer)</text>
  <text x="415" y="430" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">DROP / DUPL</text>
  <text x="415" y="450" fill="#fbbf24" font-family="monospace" font-size="10" text-anchor="middle">BUFF (DL Paging)</text>
  <text x="415" y="470" fill="#a5b4fc" font-family="monospace" font-size="10" text-anchor="middle">NOCP (DDN Trigger)</text>

  <!-- 3. QER -->
  <rect x="510" y="360" width="150" height="120" rx="6" fill="#091120" stroke="#f59e0b" />
  <text x="585" y="385" fill="#fbbf24" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">QER (QoS)</text>
  <text x="585" y="410" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">QFI 1 - 64</text>
  <text x="585" y="430" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">MBR Rate Limit</text>
  <text x="585" y="450" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">GBR Bandwidth</text>
  <text x="585" y="470" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">Gate: OPEN/CLOSE</text>

  <!-- 4. URR -->
  <rect x="680" y="360" width="150" height="120" rx="6" fill="#091120" stroke="#a855f7" />
  <text x="755" y="385" fill="#c084fc" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">URR (Charging)</text>
  <text x="755" y="410" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">Volume Accounting</text>
  <text x="755" y="430" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">Duration Tracking</text>
  <text x="755" y="450" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">Quota Threshold</text>
  <text x="755" y="470" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">Periodic Reports</text>

  <!-- External Data Interfaces -->
  <!-- N3 Access from gNodeB -->
  <rect x="30" y="370" width="90" height="60" rx="6" fill="#091120" stroke="#38bdf8" />
  <text x="75" y="395" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">gNodeB / RAN</text>
  <text x="75" y="415" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">N3 GTP-U</text>
  <line x1="120" y1="400" x2="170" y2="400" stroke="#38bdf8" stroke-width="2" />

  <!-- N6 Data Network -->
  <rect x="880" y="370" width="90" height="60" rx="6" fill="#091120" stroke="#10b981" />
  <text x="925" y="395" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Internet / DN</text>
  <text x="925" y="415" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">N6 SGi-LAN</text>
  <line x1="830" y1="400" x2="880" y2="400" stroke="#10b981" stroke-width="2" />

  <!-- Bottom Callout: Zero-Trust Security Protection Matrix -->
  <rect x="50" y="520" width="900" height="110" rx="10" fill="#091120" stroke="#1e2e4f" />
  <text x="500" y="545" fill="#fbbf24" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">PFCPForge Pro Zero-Trust Security Protection Features</text>
  <line x1="70" y1="555" x2="930" y2="555" stroke="#1e2e4f" />

  <text x="70" y="575" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="11">1. IPsec N4 Encryption (TS 33.501)</text>
  <text x="70" y="592" fill="#94a3b8" font-family="sans-serif" font-size="10">Secures UDP 8805 signaling against MITM rule tampering and traffic diversion.</text>

  <text x="360" y="575" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="11">2. Downlink Buffer OOM Protection</text>
  <text x="360" y="592" fill="#94a3b8" font-family="sans-serif" font-size="10">Caps buffering packets and timeout duration to prevent UPF kernel crashes.</text>

  <text x="670" y="575" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="11">3. Ingress Anti-IP Spoofing</text>
  <text x="670" y="592" fill="#94a3b8" font-family="sans-serif" font-size="10">PDR enforces strict matching between Source IP and allocated UE IP subnet.</text>
</svg>
